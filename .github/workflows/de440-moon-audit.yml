name: DE440 Moon ingress audit

on:
  push:
    branches:
      - research/de440-moon-audit
    paths:
      - 'research/de440-moon-audit/src/**'
      - 'research/de440-moon-audit/package.json'
      - 'research/de440-moon-audit/README.md'
      - '.github/workflows/de440-moon-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/de440-moon-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download official JPL and NAIF kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/de440-moon-audit/kernels
          curl --fail --location --retry 3 --retry-delay 3 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output research/de440-moon-audit/kernels/de440s.bsp
          curl --fail --location --retry 3 --retry-delay 3 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls \
            --output research/de440-moon-audit/kernels/naif0012.tls
          sha256sum research/de440-moon-audit/kernels/de440s.bsp research/de440-moon-audit/kernels/naif0012.tls

      - name: Install audit dependencies
        run: npm install --prefix research/de440-moon-audit

      - name: Run 300-event DE440 audit
        env:
          MOON_CORRECTION_JSON: ${{ github.workspace }}/public/data/Planetary Transit correction v4.json
        run: npm run audit --prefix research/de440-moon-audit

      - name: Commit generated comparison report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/de440-moon-audit/output/de440-moon-audit-report.json
          git add -f research/de440-moon-audit/output/de440-moon-audit-300.csv
          git commit -m "Add JPL DE440 Moon ingress audit results" || echo "No report changes to commit"
          git push origin research/de440-moon-audit
